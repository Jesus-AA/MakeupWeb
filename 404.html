<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Maria Martha</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Rutas absolutas: esta pagina se muestra en cualquier URL que no exista -->
<link rel="stylesheet" href="/css/styles.css">
<style>
  .notfound { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 48px var(--gutter); }
  .notfound__inner { display: grid; gap: 20px; justify-items: center; max-width: 520px; }
  .notfound .logo { font-size: 2rem; margin-bottom: 12px; }
  .notfound p { color: var(--tinta-soft); font-size: 1.1rem; }
</style>
</head>
<body>
<main class="notfound">
  <div class="notfound__inner">
    <a href="/" class="logo">Maria <em>Martha</em></a>
    <span class="eyebrow">Error 404</span>
    <h1 class="section__title">Esta página <em>no existe</em></h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no esté. Desde el inicio puedes ver mis servicios, tarifas y portafolio.</p>
    <a class="btn btn--primary" href="/">Volver al inicio</a>
  </div>
</main>
</body>
</html>
